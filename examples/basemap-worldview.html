<html></html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Esri Leaflet: Display static basemap tiles</title>

    <!-- Load Leaflet from local node_modules -->
    <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css" />
    <script src="../node_modules/leaflet/dist/leaflet.js"></script>

    <!-- Load Esri Leaflet production version -->
    <script src="../node_modules/esri-leaflet/dist/esri-leaflet.js"></script>

    <!-- Load Esri Leaflet Static Basemap Tile production version -->
    <script src="../dist/esri-leaflet-static-basemap-tile.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #323232;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script>

      const map = L.map("map", {
        minZoom: 2
      })

      map.setView([26.037, -89.114], 6);

      const accessToken = "AAPTxy8BH1VEsoebNVZXo8HurIOamKnP-TQacNgPnfkapJOgF-lCGhsqZnChK7hUxD-HKloooSReSbEriouxpK6WhrF6CKXE8frRgdAo5xhSDcnDby-ztuk1RgmQdzhJA83Fk1F_ux-Bvs04kq8ZLAIjEfM8q-pQ73-ctF5rP-7kDoqs4Nv_1n7GyMMCv0PafsZVUUwgHv9ZPf2Iv2QagQir6IiCce6PG36wlUMsG8SrN0k.AT1_1GxlOBsC";
      const style = "arcgis/navigation";

      const layer = L.esri.Static.staticBasemapTileLayer(style,{
        worldview: "unitedStatesOfAmerica",
        token:accessToken,
      })
      layer.addTo(map);

    </script>

  </body>

</html>
